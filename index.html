<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#dcdcda">
  <title>ナンバー抽選</title>
  <link rel="manifest" href="manifest.json">
  <!-- 数字のフォント：Anton（Google Fonts・無料。Poplar Std Black に近い縦長の極太書体） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- タップエリア（画面全体） -->
  <main id="stage">
    <img id="logo" src="images/logo.png" alt="DOUBLE DUTCH ONE'S SOLO BATTLE" draggable="false">
    <div id="panel">
      <div id="message">タップでスタート</div>
      <div id="number">?</div>
      <ol id="history" aria-label="これまでに出た数字"></ol>
    </div>
  </main>

  <!-- 操作ボタン -->
  <div id="controls" class="controls">
    <button id="btn-undo" type="button" title="1つ前に戻す">↶ 1つ戻す</button>
    <button id="btn-reset" type="button" title="最初からやり直す">⟲ 最初から</button>
    <button id="btn-sound" type="button" title="音のオン/オフ">🔊</button>
    <button id="btn-fullscreen" type="button" title="全画面">⛶ 全画面</button>
  </div>

  <!-- 確認ダイアログ -->
  <div id="confirm" class="modal" hidden>
    <div class="modal-box">
      <p>最初からやり直しますか？<br><small>これまでの結果はすべて消えます</small></p>
      <div class="modal-actions">
        <button id="confirm-no" type="button">キャンセル</button>
        <button id="confirm-yes" type="button" class="danger">やり直す</button>
      </div>
    </div>
  </div>

  <!-- 縦画面のときの案内 -->
  <div id="rotate">
    <div class="rotate-icon">📱↻</div>
    <p>端末を横向きにしてください</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
